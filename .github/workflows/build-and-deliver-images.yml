name: Build and deliver service images

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: deliver-service-images
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  VERSION_PREFIX: "1.0"

jobs:
  build-and-push:
    name: Build and deliver ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: DraftService
            image: draft-service
            dockerfile: DraftService/Dockerfile
          - service: ArticleService
            image: article-service
            dockerfile: ArticleService/Dockerfile
          - service: CommentService
            image: comment-service
            dockerfile: CommentService/Dockerfile
          - service: ProfanityService
            image: profanity-service
            dockerfile: ProfanityService/Dockerfile
          - service: PublisherService
            image: publisher-service
            dockerfile: PublisherService/Dockerfile
          - service: NewsletterService
            image: newsletter-service
            dockerfile: NewsletterService/Dockerfile
          - service: SubscriberService
            image: subscriber-service
            dockerfile: SubscriberService/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Calculate image name and version
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          repository="${repository,,}"
          version="${VERSION_PREFIX}.${GITHUB_RUN_NUMBER}"
          short_sha="${GITHUB_SHA::12}"

          echo "name=${REGISTRY}/${owner}/${repository}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.title=${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
