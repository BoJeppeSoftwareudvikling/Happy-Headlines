services:
  draft-service:
    image: draft-service:latest
    build:
      context: .
      dockerfile: DraftService/Dockerfile
    ports:
      - "5051:5051"
    environment:
      ASPNETCORE_URLS: http://+:5051
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__DraftService: Server=draft-db-sqlserver,1433;Database=Drafts;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      MONITORING_SERVICE_NAME: DraftService
      MONITORING_SEQ_URL: http://seq:5341/
      MONITORING_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    deploy:
      replicas: 2
    depends_on:
      - draft-db-sqlserver
      - seq
      - zipkin
    networks:
      - draft-db
      - monitoring

  article-service:
    image: article-service:latest
    build:
      context: .
      dockerfile: ArticleService/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__Africa: Server=article-db-sqlserver,1433;Database=ArticlesAfrica;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__Asia: Server=article-db-sqlserver,1433;Database=ArticlesAsia;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__Europe: Server=article-db-sqlserver,1433;Database=ArticlesEurope;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__NorthAmerica: Server=article-db-sqlserver,1433;Database=ArticlesNorthAmerica;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__SouthAmerica: Server=article-db-sqlserver,1433;Database=ArticlesSouthAmerica;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__Oceania: Server=article-db-sqlserver,1433;Database=ArticlesOceania;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__Antarctica: Server=article-db-sqlserver,1433;Database=ArticlesAntarctica;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__Global: Server=article-db-sqlserver,1433;Database=ArticlesGlobal;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      MONITORING_SERVICE_NAME: ArticleService
      MONITORING_SEQ_URL: http://seq:5341/
      MONITORING_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    deploy:
      replicas: 3
    depends_on:
      - article-db-sqlserver
      - seq
      - zipkin
    networks:
      - article-db
      - monitoring

  comment-service:
    image: comment-service:latest
    build:
      context: .
      dockerfile: CommentService/Dockerfile
    ports:
      - "5049:5049"
    environment:
      ASPNETCORE_URLS: http://+:5049
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__CommentService: Server=comment-db-sqlserver,1433;Database=Comments;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ProfanityService__BaseUrl: http://profanity-service:5050/
      ProfanityService__TimeoutSeconds: "2"
      ProfanityService__FailureThreshold: "3"
      ProfanityService__BreakDurationSeconds: "30"
      MONITORING_SERVICE_NAME: CommentService
      MONITORING_SEQ_URL: http://seq:5341/
      MONITORING_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    deploy:
      replicas: 2
    depends_on:
      - comment-db-sqlserver
      - seq
      - zipkin
    networks:
      - comment-db
      - moderation-link
      - monitoring

  profanity-service:
    image: profanity-service:latest
    build:
      context: .
      dockerfile: ProfanityService/Dockerfile
    ports:
      - "5050:5050"
    environment:
      ASPNETCORE_URLS: http://+:5050
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__ProfanityService: Server=profanity-db-sqlserver,1433;Database=Profanity;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      MONITORING_SERVICE_NAME: ProfanityService
      MONITORING_SEQ_URL: http://seq:5341/
      MONITORING_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    deploy:
      replicas: 2
    networks:
      - profanity-db
      - moderation-link
      - monitoring
    depends_on:
      - profanity-db-sqlserver
      - seq
      - zipkin

  seq:
    image: datalust/seq
    ports:
      - "127.0.0.1:5341:5341"
      - "127.0.0.1:5342:80"
    volumes:
      - happy_headlines_seq_data:/data
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    networks:
      - monitoring

  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    networks:
      - monitoring

  article-db-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1437:1433"
    networks:
      - article-db

  draft-db-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1438:1433"
    networks:
      - draft-db
  
  comment-db-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1435:1433"
    networks:
      - comment-db

  profanity-db-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1436:1433"
    networks:
      - profanity-db

networks:
  draft-db:
  article-db:
  comment-db:
  profanity-db:
  moderation-link:
  monitoring:

volumes:
  happy_headlines_seq_data:
