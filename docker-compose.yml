services:
  draft-service:
    image: draft-service:latest
    build:
      context: .
      dockerfile: DraftService/Dockerfile
    ports:
      - "5051:5051"
    environment:
      ASPNETCORE_URLS: http://+:5051
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__DraftService: Server=draft-db-sqlserver,1433;Database=Drafts;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      MONITORING_SERVICE_NAME: DraftService
      MONITORING_SEQ_URL: http://seq:5341/
      MONITORING_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    deploy:
      replicas: 2
    depends_on:
      - draft-db-sqlserver
      - seq
      - zipkin
    networks:
      - draft-db
      - monitoring

  article-service:
    image: article-service:latest
    build:
      context: .
      dockerfile: ArticleService/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__Africa: Server=article-db-sqlserver,1433;Database=ArticlesAfrica;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__Asia: Server=article-db-sqlserver,1433;Database=ArticlesAsia;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__Europe: Server=article-db-sqlserver,1433;Database=ArticlesEurope;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__NorthAmerica: Server=article-db-sqlserver,1433;Database=ArticlesNorthAmerica;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__SouthAmerica: Server=article-db-sqlserver,1433;Database=ArticlesSouthAmerica;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__Oceania: Server=article-db-sqlserver,1433;Database=ArticlesOceania;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__Antarctica: Server=article-db-sqlserver,1433;Database=ArticlesAntarctica;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__Global: Server=article-db-sqlserver,1433;Database=ArticlesGlobal;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      MONITORING_SERVICE_NAME: ArticleService
      MONITORING_SEQ_URL: http://seq:5341/
      MONITORING_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
      ArticleCache__ConnectionString: article-cache:6379
      ArticleCache__WindowDays: "14"
      ArticleCache__RefreshIntervalSeconds: "30"
    deploy:
      replicas: 3
    depends_on:
      - article-db-sqlserver
      - rabbitmq
      - article-cache
      - seq
      - zipkin
    networks:
      - article-db
      - article-queue
      - article-cache-network
      - monitoring

  publisher-service:
    image: publisher-service:latest
    build:
      context: .
      dockerfile: PublisherService/Dockerfile
    ports:
      - "5052:5052"
    environment:
      ASPNETCORE_URLS: http://+:5052
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_EnableDiagnostics: "0"
      ProfanityService__BaseUrl: http://profanity-service:5050/
      ProfanityService__TimeoutSeconds: "2"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
      MONITORING_SERVICE_NAME: PublisherService
      MONITORING_SEQ_URL: http://seq:5341/
      MONITORING_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    deploy:
      replicas: 2
    depends_on:
      - profanity-service
      - rabbitmq
      - seq
      - zipkin
    networks:
      - moderation-link
      - article-queue
      - monitoring

  newsletter-service:
    image: newsletter-service:latest
    build:
      context: .
      dockerfile: NewsletterService/Dockerfile
    ports:
      - "5053:5053"
    environment:
      ASPNETCORE_URLS: http://+:5053
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_EnableDiagnostics: "0"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
      SubscriberQueue__HostName: subscriber-queue
      SubscriberQueue__Port: "5672"
      SubscriberQueue__UserName: ${RABBITMQ_DEFAULT_USER}
      SubscriberQueue__Password: ${RABBITMQ_DEFAULT_PASS}
      MONITORING_SERVICE_NAME: NewsletterService
      MONITORING_SEQ_URL: http://seq:5341/
      MONITORING_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      - rabbitmq
      - subscriber-queue
      - seq
      - zipkin
    networks:
      - article-queue
      - subscriber-queue-network
      - monitoring

  subscriber-service:
    image: subscriber-service:latest
    build:
      context: .
      dockerfile: SubscriberService/Dockerfile
    ports:
      - "5054:5054"
    environment:
      ASPNETCORE_URLS: http://+:5054
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__SubscriberService: Server=subscriber-db-sqlserver,1433;Database=Subscribers;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      SubscriberQueue__HostName: subscriber-queue
      SubscriberQueue__Port: "5672"
      SubscriberQueue__UserName: ${RABBITMQ_DEFAULT_USER}
      SubscriberQueue__Password: ${RABBITMQ_DEFAULT_PASS}
      FeatureHub__EdgeUrl: http://featurehub:8085
      FeatureHub__SdkKey: ${FEATUREHUB_API_KEY}
      FeatureHub__FeatureKey: subscriberservice-release-toggle
      MONITORING_SERVICE_NAME: SubscriberService
      MONITORING_SEQ_URL: http://seq:5341/
      MONITORING_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      - subscriber-db-sqlserver
      - subscriber-queue
      - featurehub
      - seq
      - zipkin
    networks:
      - subscriber-db
      - subscriber-queue-network
      - feature-management
      - monitoring

  comment-service:
    image: comment-service:latest
    build:
      context: .
      dockerfile: CommentService/Dockerfile
    ports:
      - "5049:5049"
    environment:
      ASPNETCORE_URLS: http://+:5049
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__CommentService: Server=comment-db-sqlserver,1433;Database=Comments;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ProfanityService__BaseUrl: http://profanity-service:5050/
      ProfanityService__TimeoutSeconds: "2"
      ProfanityService__FailureThreshold: "3"
      ProfanityService__BreakDurationSeconds: "30"
      CommentCache__ConnectionString: comment-cache:6379
      MONITORING_SERVICE_NAME: CommentService
      MONITORING_SEQ_URL: http://seq:5341/
      MONITORING_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    deploy:
      replicas: 2
    depends_on:
      - comment-db-sqlserver
      - comment-cache
      - seq
      - zipkin
    networks:
      - comment-db
      - moderation-link
      - comment-cache-network
      - monitoring

  profanity-service:
    image: profanity-service:latest
    build:
      context: .
      dockerfile: ProfanityService/Dockerfile
    ports:
      - "5050:5050"
    environment:
      ASPNETCORE_URLS: http://+:5050
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__ProfanityService: Server=profanity-db-sqlserver,1433;Database=Profanity;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      MONITORING_SERVICE_NAME: ProfanityService
      MONITORING_SEQ_URL: http://seq:5341/
      MONITORING_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    deploy:
      replicas: 2
    networks:
      - profanity-db
      - moderation-link
      - monitoring
    depends_on:
      - profanity-db-sqlserver
      - seq
      - zipkin

  seq:
    image: datalust/seq
    ports:
      - "127.0.0.1:5341:5341"
      - "127.0.0.1:5342:80"
    volumes:
      - happy_headlines_seq_data:/data
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    networks:
      - monitoring

  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    networks:
      - monitoring

  article-cache:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - article-cache-network

  comment-cache:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:6381:6379"
    networks:
      - comment-cache-network

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/cache-alerts.yml:/etc/prometheus/rules/cache-alerts.yml:ro
      - happy_headlines_prometheus_data:/prometheus
    networks:
      - monitoring
    depends_on:
      - article-service
      - comment-service

  grafana:
    image: grafana/grafana:13.1.6
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - happy_headlines_grafana_data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - happy_headlines_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - article-queue

  subscriber-queue:
    image: rabbitmq:4-management
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - happy_headlines_subscriber_queue_data:/var/lib/rabbitmq
    networks:
      - subscriber-queue-network

  featurehub:
    image: featurehub/party-server:latest
    restart: always
    ports:
      - "8085:8085"
    volumes:
      - happy_headlines_featurehub_data:/db
    networks:
      - feature-management

  article-db-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1437:1433"
    networks:
      - article-db

  draft-db-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1438:1433"
    networks:
      - draft-db

  subscriber-db-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1439:1433"
    networks:
      - subscriber-db
  
  comment-db-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1435:1433"
    networks:
      - comment-db

  profanity-db-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1436:1433"
    networks:
      - profanity-db

networks:
  draft-db:
  article-db:
  comment-db:
  profanity-db:
  subscriber-db:
  moderation-link:
  article-queue:
  subscriber-queue-network:
  feature-management:
  article-cache-network:
  comment-cache-network:
  monitoring:

volumes:
  happy_headlines_seq_data:
  happy_headlines_rabbitmq_data:
  happy_headlines_subscriber_queue_data:
  happy_headlines_featurehub_data:
  happy_headlines_prometheus_data:
  happy_headlines_grafana_data:
