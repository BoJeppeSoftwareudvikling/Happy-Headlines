services:
  article-service:
    build:
      context: .
      dockerfile: ArticleService/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
    deploy:
      replicas: 3
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - SA_PASSWORD=Your_@Strong_Password123
      - ACCEPT_EULA=Y
    ports:
      - 1433:1433