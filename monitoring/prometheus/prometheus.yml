global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: happy-headlines
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks

    relabel_configs:
      - source_labels:
          - __meta_dockerswarm_task_desired_state
        regex: running
        action: keep

      - source_labels:
          - __meta_dockerswarm_service_label_prometheus_scrape
        regex: "true"
        action: keep

      - source_labels:
          - __meta_dockerswarm_network_name
        regex: .*_monitoring
        action: keep

      - source_labels:
          - __address__
          - __meta_dockerswarm_service_label_prometheus_port
        separator: ;
        regex: (.+):(\d+);(\d+)
        replacement: ${1}:${3}
        target_label: __address__

      - source_labels:
          - __meta_dockerswarm_service_label_prometheus_path
        regex: (.+)
        target_label: __metrics_path__

      - source_labels:
          - __meta_dockerswarm_service_name
        target_label: service

      - source_labels:
          - __meta_dockerswarm_service_name
          - __meta_dockerswarm_task_slot
        separator: "-"
        target_label: instance
