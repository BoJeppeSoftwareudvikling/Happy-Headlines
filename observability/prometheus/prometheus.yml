global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: article-cache
    metrics_path: /metrics/cache
    static_configs:
      - targets:
          - article-service:8080

  - job_name: comment-cache
    metrics_path: /metrics/cache
    static_configs:
      - targets:
          - comment-service:5049
